name: Moorlan
options:
  bundleIdPrefix: app.moorlan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    DEVELOPMENT_TEAM: ""
packages:
  MoorlanCore:
    path: MoorlanCore
  WireGuardKit:
    path: Vendor/wireguard-apple
targets:
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: /usr/bin/make
      # Match upstream wireguard-apple so Clean/Build actions reach make.
      arguments: "$(ACTION)"
      passSettings: true
      workingDirectory: "$(PROJECT_DIR)/Vendor/wireguard-apple/Sources/WireGuardKitGo"
    settings:
      base:
        SDKROOT: iphoneos
        # Ensure Xcode's make invocation can find Homebrew Go.
        PATH: "$(PATH):/opt/homebrew/bin:/usr/local/bin"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.moorlan.ios.tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: "YES"
    dependencies:
      - target: WireGuardGoBridgeiOS
      - package: MoorlanCore
        product: MoorlanCore
      - package: WireGuardKit
        product: WireGuardKit
    scheme: {}

  Moorlan:
    type: application
    platform: iOS
    sources:
      - path: Moorlan
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.moorlan.ios
        INFOPLIST_FILE: Moorlan/Info.plist
        CODE_SIGN_ENTITLEMENTS: Moorlan/Moorlan.entitlements
        PRODUCT_NAME: Moorlan
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: MoorlanCore
        product: MoorlanCore
      - package: WireGuardKit
        product: WireGuardKit
    scheme:
      testTargets: []
schemes:
  Moorlan:
    build:
      targets:
        WireGuardGoBridgeiOS: [all]
        PacketTunnel: [all]
        Moorlan: [all]
    run:
      config: Debug
