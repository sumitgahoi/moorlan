name: PeerDoor
options:
  bundleIdPrefix: app.peerdoor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    DEVELOPMENT_TEAM: ""
packages:
  PeerDoorCore:
    path: PeerDoorCore
  WireGuardKit:
    path: Vendor/wireguard-apple
targets:
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: /usr/bin/make
      arguments: ""
      passSettings: true
      workingDirectory: "$(PROJECT_DIR)/Vendor/wireguard-apple/Sources/WireGuardKitGo"
    settings:
      base:
        SDKROOT: iphoneos

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.peerdoor.ios.tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: "YES"
    dependencies:
      - target: WireGuardGoBridgeiOS
      - package: PeerDoorCore
        product: PeerDoorCore
      - package: WireGuardKit
        product: WireGuardKit
    scheme: {}

  PeerDoor:
    type: application
    platform: iOS
    sources:
      - path: PeerDoor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.peerdoor.ios
        INFOPLIST_FILE: PeerDoor/Info.plist
        CODE_SIGN_ENTITLEMENTS: PeerDoor/PeerDoor.entitlements
        PRODUCT_NAME: PeerDoor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: PeerDoorCore
        product: PeerDoorCore
      - package: WireGuardKit
        product: WireGuardKit
      - target: WireGuardGoBridgeiOS
    scheme:
      testTargets: []
schemes:
  PeerDoor:
    build:
      targets:
        WireGuardGoBridgeiOS: [all]
        PacketTunnel: [all]
        PeerDoor: [all]
    run:
      config: Debug
